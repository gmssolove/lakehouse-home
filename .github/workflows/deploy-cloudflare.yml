name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        run: pnpm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d47331fa71b913d9497c2ede130ab0fb

      - name: Upload Worker secrets
        if: success()
        run: |
          printf '%s' "$R2_ACCOUNT_ID" | npx wrangler secret put R2_ACCOUNT_ID
          printf '%s' "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID
          printf '%s' "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY
          printf '%s' "$R2_BUCKET_NAME" | npx wrangler secret put R2_BUCKET_NAME
          printf '%s' "$R2_PUBLIC_BASE_URL" | npx wrangler secret put R2_PUBLIC_BASE_URL
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          fi
          if [ -n "$GEMINI_MODEL" ]; then
            printf '%s' "$GEMINI_MODEL" | npx wrangler secret put GEMINI_MODEL
          fi
          if [ -n "$GEMINI_FALLBACK_MODEL" ]; then
            printf '%s' "$GEMINI_FALLBACK_MODEL" | npx wrangler secret put GEMINI_FALLBACK_MODEL
          fi
          if [ -n "$GEMINI_LITE_MODEL" ]; then
            printf '%s' "$GEMINI_LITE_MODEL" | npx wrangler secret put GEMINI_LITE_MODEL
          fi
          if [ -n "$GEMINI_VERIFY_MODEL" ]; then
            printf '%s' "$GEMINI_VERIFY_MODEL" | npx wrangler secret put GEMINI_VERIFY_MODEL
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          fi
          if [ -n "$ANTHROPIC_MODEL" ]; then
            printf '%s' "$ANTHROPIC_MODEL" | npx wrangler secret put ANTHROPIC_MODEL
          fi
          if [ -n "$ANTHROPIC_VERIFY_MODEL" ]; then
            printf '%s' "$ANTHROPIC_VERIFY_MODEL" | npx wrangler secret put ANTHROPIC_VERIFY_MODEL
          fi
          if [ -n "$OC_CHAT_PROVIDER" ]; then
            printf '%s' "$OC_CHAT_PROVIDER" | npx wrangler secret put OC_CHAT_PROVIDER
          fi
          if [ -n "$CRON_SECRET" ]; then
            printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d47331fa71b913d9497c2ede130ab0fb
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          GEMINI_LITE_MODEL: ${{ secrets.GEMINI_LITE_MODEL }}
          GEMINI_VERIFY_MODEL: ${{ secrets.GEMINI_VERIFY_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_VERIFY_MODEL: ${{ secrets.ANTHROPIC_VERIFY_MODEL }}
          OC_CHAT_PROVIDER: ${{ secrets.OC_CHAT_PROVIDER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
