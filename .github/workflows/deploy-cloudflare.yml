name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # secret put 루프는 시크릿마다 Worker 버전을 만들어 배포 직후 503/TIMEOUT 스톰을 유발함.
      # secret bulk = 원자적 1회 버전. 배포 전에 올려 최종 코드 배포가 secrets를 유지하게 함.
      - name: Upload Worker secrets (bulk)
        run: |
          python3 <<'PY'
          import json, os
          keys = [
            "R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY",
            "R2_BUCKET_NAME", "R2_PUBLIC_BASE_URL",
            "GEMINI_API_KEY", "GEMINI_MODEL", "GEMINI_FALLBACK_MODEL",
            "GEMINI_LITE_MODEL", "GEMINI_VERIFY_MODEL",
            "ANTHROPIC_API_KEY", "ANTHROPIC_MODEL", "ANTHROPIC_VERIFY_MODEL",
            "OC_CHAT_PROVIDER", "CRON_SECRET", "FIREBASE_DATABASE_SECRET",
          ]
          payload = {k: os.environ[k] for k in keys if os.environ.get(k)}
          if "R2_ACCOUNT_ID" not in payload:
            raise SystemExit("R2_ACCOUNT_ID missing — abort secret bulk")
          with open("worker-secrets.json", "w", encoding="utf-8") as f:
            json.dump(payload, f)
          print(f"secret bulk keys: {', '.join(sorted(payload))}")
          PY
          npx wrangler secret bulk worker-secrets.json
          rm -f worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d47331fa71b913d9497c2ede130ab0fb
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          GEMINI_LITE_MODEL: ${{ secrets.GEMINI_LITE_MODEL }}
          GEMINI_VERIFY_MODEL: ${{ secrets.GEMINI_VERIFY_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_VERIFY_MODEL: ${{ secrets.ANTHROPIC_VERIFY_MODEL }}
          OC_CHAT_PROVIDER: ${{ secrets.OC_CHAT_PROVIDER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIREBASE_DATABASE_SECRET: ${{ secrets.FIREBASE_DATABASE_SECRET }}

      - name: Build and deploy
        run: pnpm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d47331fa71b913d9497c2ede130ab0fb
