<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>후보 G - 링+도트 가로 압축형</title>
<style>
  :root{
    --gold:#A27C3E; --gold-soft:#C9A876;
    --bot-bubble:#3A3936; --user-bubble:#8B6C3C;
    --card-bg:rgba(20,19,17,0.96); --card-border:rgba(162,124,62,0.35);
    --text:#EFE9DF; --sub:#9B958A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
    background: radial-gradient(ellipse at 50% 0%, rgba(60,55,45,0.5), transparent 60%), #0B0A09;
    color:var(--text); display:flex; align-items:flex-start; justify-content:center; gap:24px;
    padding:40px 20px; flex-wrap:wrap;
  }
  .note{ width:250px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    border-radius:16px; padding:16px; font-size:12.5px; color:var(--sub); line-height:1.65; }
  .note h3{margin:0 0 10px; font-size:14px; color:var(--text);}
  .note button{ width:100%; margin-top:8px; padding:9px; border-radius:10px; border:1px solid rgba(162,124,62,0.5);
    background:rgba(255,255,255,0.05); color:var(--text); font-size:12.5px; cursor:pointer; }

  .chat{ width:380px; height:620px; background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:18px; display:flex; flex-direction:column; overflow:hidden; position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.5); flex-shrink:0; }
  .chat-header{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .c-avatar{ width:36px; height:36px; border-radius:50%; background:#2b2a27; display:flex; align-items:center;
    justify-content:center; font-size:13px; color:var(--gold-soft); border:1px solid rgba(255,255,255,0.1); }
  .c-name{ font-size:14.5px; font-weight:700; }
  .c-status{ font-size:11px; color:#7fbf8f; display:flex; align-items:center; gap:4px; }
  .c-status .dot{ width:6px; height:6px; border-radius:50%; background:#7fbf8f; }
  .h-icons{ margin-left:auto; display:flex; gap:12px; color:var(--sub); font-size:16px; }
  .chatlog{ flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:10px; position:relative; }
  .row{ display:flex; }
  .row.them{ justify-content:flex-start; }
  .row.me{ justify-content:flex-end; }
  .bubble{ max-width:70%; padding:9px 13px; border-radius:14px; font-size:13px; line-height:1.55; }
  .them .bubble{ background:var(--bot-bubble); color:var(--text); border-bottom-left-radius:4px; }
  .me .bubble{ background:var(--user-bubble); color:#1c1712; border-bottom-right-radius:4px; font-weight:500; }
  .input-bar{ display:flex; align-items:center; gap:8px; padding:12px 14px; border-top:1px solid rgba(255,255,255,0.08); }
  .input-bar input{ flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:999px; padding:9px 14px; color:var(--text); font-size:12.5px; }

  /* ===== 후보 G: 링(좌) + 텍스트/도트(우) 가로 압축, 상단 ===== */
  .tier-toast{
    position:absolute; left:16px; right:16px; top:14px; z-index:20;
    opacity:0; transform:translateY(-12px) scale(0.96); pointer-events:none;
  }
  .tier-toast.show{ animation:rowPop 3.5s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes rowPop{
    0%{opacity:0; transform:translateY(-12px) scale(0.96);}
    14%{opacity:1; transform:translateY(0) scale(1);}
    85%{opacity:1; transform:translateY(0) scale(1);}
    100%{opacity:0; transform:translateY(-6px) scale(0.98);}
  }
  .row-card{
    background:rgba(24,22,19,0.94); border:1px solid rgba(255,255,255,0.08); border-radius:14px;
    padding:10px 12px; box-shadow:0 12px 26px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:11px;
  }
  .row-ring-wrap{ position:relative; width:42px; height:42px; flex-shrink:0; }
  .row-ring-avatar{
    position:absolute; inset:4px; border-radius:50%; background:#2b2a27;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--gold-soft);
  }
  .row-text{ flex:1; min-width:0; }
  .row-title{ font-size:11px; color:var(--sub); }
  .row-tier{ font-size:13px; font-weight:800; color:var(--gold-soft); margin-top:1px; }
  .row-dots{ display:flex; gap:4px; margin-top:6px; }
  .dot-seg{ flex:1; height:3px; border-radius:99px; background:rgba(255,255,255,0.1); overflow:hidden; }
  .dot-seg .fill{ height:100%; width:0%; background:linear-gradient(90deg,#A27C3E,#E4C77F); border-radius:99px; }
  .dot-seg.filled .fill{ width:100%; }
</style>
</head>
<body>
  <div class="note">
    <h3>후보 G · 링+도트 가로 압축형</h3>
    왼쪽에 작은 링+아바타, 오른쪽에 텍스트와 5단계 도트를 한 줄로 압축했어요. F보다 훨씬 슬림해서 채팅 내용을 덜 가려요.
    <button onclick="play()">토스트 재생</button>
  </div>
  <div class="chat">
    <div class="chat-header">
      <div class="c-avatar">카</div>
      <div><div class="c-name">강 카논</div><div class="c-status"><span class="dot"></span>온라인</div></div>
      <div class="h-icons"><span>♡</span><span>⋮</span><span>✕</span></div>
    </div>
    <div class="chatlog">
      <div class="tier-toast" id="toast">
        <div class="row-card">
          <div class="row-ring-wrap">
            <svg width="42" height="42" viewBox="0 0 42 42">
              <circle cx="21" cy="21" r="18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
              <circle id="ring-progress" cx="21" cy="21" r="18" fill="none" stroke="#C9A876" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="113"
                transform="rotate(-90 21 21)"/>
            </svg>
            <div class="row-ring-avatar">카</div>
          </div>
          <div class="row-text">
            <div class="row-title">카논과의 관계가 발전했어요</div>
            <div class="row-tier">아는 사람</div>
            <div class="row-dots">
              <div class="dot-seg filled"><div class="fill"></div></div>
              <div class="dot-seg" id="seg2"><div class="fill"></div></div>
              <div class="dot-seg"><div class="fill"></div></div>
              <div class="dot-seg"><div class="fill"></div></div>
              <div class="dot-seg"><div class="fill"></div></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row them"><div class="bubble">오늘 뭐 했어?</div></div>
      <div class="row me"><div class="bubble">그냥 집에서 쉬었어~</div></div>
      <div class="row them"><div class="bubble">오, 나도 오랜만에 쉬고 싶다</div></div>
    </div>
    <div class="input-bar"><input type="text" placeholder="메시지 보내기"></div>
  </div>
<script>
  function play(){
    const t = document.getElementById('toast');
    const ring = document.getElementById('ring-progress');
    const seg2fill = document.querySelector('#seg2 .fill');
    t.classList.remove('show');
    ring.style.transition='none'; ring.style.strokeDashoffset = 113;
    seg2fill.style.transition='none'; seg2fill.style.width='0%';
    void t.offsetWidth;
    t.classList.add('show');
    setTimeout(()=>{
      ring.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)';
      ring.style.strokeDashoffset = 113 - 113 * 0.4;
      seg2fill.style.transition='width 1s cubic-bezier(.22,1,.36,1)';
      seg2fill.style.width='100%';
    }, 350);
  }
  window.addEventListener('load', play);
</script>
</body>
</html>
